name: Publish to PyPI

# Publishes on a GitHub Release using PyPI Trusted Publishing (OIDC).
# No API tokens / secrets are stored anywhere — the short-lived OIDC token
# minted by GitHub Actions is exchanged directly with PyPI at publish time.
#
# One-time setup on pypi.org (Trusted Publisher, "pending" before first upload):
#   Project name = due-diligence-engine
#   Owner        = Atlas-Associates-Inc
#   Repository   = Due-diligence-engine
#   Workflow     = publish.yml
#   Environment  = pypi
# Plus a repo Environment named exactly "pypi" (Settings -> Environments).

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build backend
        run: python -m pip install --upgrade pip build

      - name: Build distributions
        run: python -m build

      - name: Verify distribution metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Must match the environment name registered in the PyPI Trusted Publisher.
    environment:
      name: pypi
      url: https://pypi.org/project/due-diligence-engine/
    permissions:
      id-token: write   # REQUIRED for OIDC Trusted Publishing
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No 'with: password' — Trusted Publishing (OIDC) authenticates.
