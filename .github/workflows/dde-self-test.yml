name: DDE Self-Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  self-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run DDE on self
        uses: ./
        id: dde
        with:
          skip_ai: 'true'

      - name: Show Results
        run: |
          echo "Score: ${{ steps.dde.outputs.score }}"
          echo "Grade: ${{ steps.dde.outputs.grade }}"
          echo "Red Flags: ${{ steps.dde.outputs.red_flags }}"

      - name: Validate Outputs
        run: |
          score="${{ steps.dde.outputs.score }}"
          grade="${{ steps.dde.outputs.grade }}"
          if [ -z "$score" ]; then
            echo "::error::Score output is empty"
            exit 1
          fi
          if [[ ! "$grade" =~ ^[ABCDF]$ ]]; then
            echo "::error::Invalid grade: $grade (expected A|B|C|D|F)"
            exit 1
          fi
