name: 'Due Diligence Engine'
description: 'AI-powered technical due diligence for startup codebases. Paste a GitHub URL → get a score.'
author: 'Atlas Associates Inc'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  anthropic_api_key:
    description: 'Anthropic API key for AI-enhanced analysis'
    required: false
  skip_ai:
    description: 'Skip AI analysis (local-only, free)'
    required: false
    default: 'false'
  output_format:
    description: 'Output formats (md, html)'
    required: false
    default: 'md'
  fail_below:
    description: 'Fail the check if score is below this threshold (0-100)'
    required: false
    default: '0'

outputs:
  score:
    description: 'Overall DD score (0-100)'
    value: ${{ steps.run_dde.outputs.score }}
  grade:
    description: 'Grade (A/B/C/D/F)'
    value: ${{ steps.run_dde.outputs.grade }}
  report_path:
    description: 'Path to the generated report'
    value: ${{ steps.run_dde.outputs.report_path }}
  red_flags:
    description: 'Number of red flags detected'
    value: ${{ steps.run_dde.outputs.red_flags }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install DDE
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        INPUT_SKIP_AI: ${{ inputs.skip_ai }}
      run: |
        if [ -n "$ANTHROPIC_API_KEY" ] && [ "$INPUT_SKIP_AI" != "true" ]; then
          python -m pip install -e "${{ github.action_path }}[byok]"
        else
          python -m pip install -e "${{ github.action_path }}"
        fi

    - name: Run Analysis
      id: run_dde
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        INPUT_SKIP_AI: ${{ inputs.skip_ai }}
        INPUT_OUTPUT_FORMAT: ${{ inputs.output_format }}
      run: |
        if [ "$INPUT_OUTPUT_FORMAT" = "html" ]; then
          ARGS="--format md --format html"
        else
          ARGS="--format $INPUT_OUTPUT_FORMAT"
        fi
        if [ "$INPUT_SKIP_AI" = "true" ] || [ -z "$ANTHROPIC_API_KEY" ]; then
          ARGS="$ARGS --skip-ai"
        fi

        dde analyze . $ARGS -o dde_output 2>&1 | tee dde_log.txt

        # Extract score from the FIRST report file only (single-line outputs only)
        REPORT=$(ls dde_output/dde_report_*.md 2>/dev/null | head -1)
        if [ -z "$REPORT" ]; then
          echo "::warning::No DDE report generated"
          REPORT="(none)"
          SCORE="0"
          GRADE="?"
          FLAGS="0"
        else
          SCORE=$( (grep -oE '\*\*Overall Score:\*\*\s*[0-9]+([.][0-9]+)?' "$REPORT" 2>/dev/null || true) | (grep -oE '[0-9]+([.][0-9]+)?' || true) | head -1)
          if [ -z "$SCORE" ]; then
            SCORE=$( (grep -oE 'Overall Score:\s*[0-9]+([.][0-9]+)?' "$REPORT" 2>/dev/null || true) | (grep -oE '[0-9]+([.][0-9]+)?' || true) | head -1)
          fi
          GRADE=$( (grep -oE '\(Grade:\s*[A-F]\)' "$REPORT" 2>/dev/null || true) | (grep -oE '[A-F]' || true) | head -1)
          if [ -z "$GRADE" ]; then
            GRADE=$( (grep -oE 'Grade:\s*[A-F]' "$REPORT" 2>/dev/null || true) | (grep -oE '[A-F]' || true) | head -1)
          fi
          FLAGS=$(grep -cE '^\s*-\s*\*\*\[(CRITICAL|HIGH|MEDIUM|LOW|INFO)\]\*\*' "$REPORT" 2>/dev/null || true)

          # Defaults if grep returned empty
          SCORE="${SCORE:-0}"
          GRADE="${GRADE:-?}"
          FLAGS="${FLAGS:-0}"
        fi

        echo "score=$SCORE" >> "$GITHUB_OUTPUT"
        echo "grade=$GRADE" >> "$GITHUB_OUTPUT"
        echo "red_flags=$FLAGS" >> "$GITHUB_OUTPUT"
        echo "report_path=$REPORT" >> "$GITHUB_OUTPUT"

        echo "## Due Diligence Score: $SCORE/100 (Grade: $GRADE)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Red Flags: $FLAGS" >> $GITHUB_STEP_SUMMARY

    - name: Upload Report
      uses: actions/upload-artifact@v7
      with:
        name: dde-report
        path: dde_output/

    - name: Score Threshold Check
      shell: bash
      if: ${{ inputs.fail_below != '0' }}
      env:
        FAIL_BELOW: ${{ inputs.fail_below }}
        SCORE: ${{ steps.run_dde.outputs.score }}
      run: |
        python3 -c '
        import math
        import os
        import sys

        try:
            score = float(os.environ["SCORE"])
            threshold = float(os.environ["FAIL_BELOW"])
            if not all(math.isfinite(value) and 0 <= value <= 100 for value in (score, threshold)):
                raise ValueError
        except (KeyError, ValueError):
            sys.exit("::error::SCORE and FAIL_BELOW must be finite numbers from 0 to 100")
        if score < threshold:
            sys.exit(f"::error::DDE Score ({score}) is below threshold ({threshold})")
        '
