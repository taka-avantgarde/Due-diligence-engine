[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "due-diligence-engine"
version = "0.6.3"
description = "AI-powered technical due diligence CLI — PDF-first, zero API keys required"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Takayuki Miyano", email = "taka@atlasassociates.io" },
]
maintainers = [
    { name = "Atlas Associates Inc" },
]
keywords = [
    "due-diligence",
    "technical-due-diligence",
    "code-audit",
    "repository-analysis",
    "static-analysis",
    "code-review",
    "pdf-report",
    "cli",
    "ai",
    "mergers-and-acquisitions",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Documentation",
    "Topic :: Utilities",
]

# Core dependencies — the flagship `dde prompt --pdf` flow is 100% local and
# needs NO API keys. AI-provider SDKs are intentionally NOT here; see the
# optional [byok] extra below.
dependencies = [
    "click>=8.3.1",
    "jinja2>=3.1.6",
    "rich>=14.3.3",
    "cryptography>=46.0.7",
    "pydantic>=2.12.5",
    "reportlab>=5.1.0",
    "httpx>=0.28.1",
    "arabic-reshaper>=3.0.0",  # Arabic report rendering (contextual shaping)
    "python-bidi>=0.6.11",     # Arabic report rendering (RTL bidi reordering)
]

[project.optional-dependencies]
# BYOK ("bring your own key") — optional AI-provider SDKs for the multi-model
# cross-verification path (`dde analyze` with managed API keys). The local-only
# `dde prompt --pdf` flow needs NONE of these.
byok = [
    "anthropic>=0.84.0",
    "google-genai>=2.30.1",
    "openai>=1.55.3",
]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[project.urls]
Homepage = "https://github.com/Atlas-Associates-Inc/Due-diligence-engine"
Repository = "https://github.com/Atlas-Associates-Inc/Due-diligence-engine"
Issues = "https://github.com/Atlas-Associates-Inc/Due-diligence-engine/issues"

[project.scripts]
dde = "due_diligence_engine.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["due_diligence_engine"]
# Bundle the Noto TTF fonts (Vietnamese / Thai report rendering) and templates into the wheel.
artifacts = [
    "due_diligence_engine/report/fonts/*.ttf",
    "due_diligence_engine/report/templates/*.html",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["due_diligence_engine"]
omit = ["due_diligence_engine/report/fonts/*"]

[tool.coverage.report]
show_missing = true
