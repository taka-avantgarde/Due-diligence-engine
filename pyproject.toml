[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "due-diligence-engine"
version = "0.6.0"
description = "AI-powered technical due diligence CLI — PDF-first, zero API keys required"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Takayuki Miyano", email = "taka@atlasassociates.io" },
]
maintainers = [
    { name = "Atlas Associates Inc" },
]
keywords = [
    "due-diligence",
    "technical-due-diligence",
    "code-audit",
    "repository-analysis",
    "static-analysis",
    "code-review",
    "pdf-report",
    "cli",
    "ai",
    "mergers-and-acquisitions",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Documentation",
    "Topic :: Utilities",
]

# Core dependencies — the flagship `dde prompt --pdf` flow is 100% local and
# needs NO API keys. AI-provider SDKs are intentionally NOT here; see the
# optional [byok] extra below.
dependencies = [
    "click>=8.1.0",
    "jinja2>=3.1.0",
    "rich>=13.0.0",
    "cryptography>=43.0.0",
    "pydantic>=2.0.0",
    "gitpython>=3.1.0",
    "reportlab>=4.1.0",
    "httpx>=0.27.0",
    "arabic-reshaper>=3.0.0",  # Arabic report rendering (contextual shaping)
    "python-bidi>=0.4.2",      # Arabic report rendering (RTL bidi reordering)
]

[project.optional-dependencies]
# BYOK ("bring your own key") — optional AI-provider SDKs for the multi-model
# cross-verification path (`dde analyze` with managed API keys). The local-only
# `dde prompt --pdf` flow needs NONE of these.
byok = [
    "anthropic>=0.45.0",
    "google-generativeai>=0.8.0",
    "openai>=1.50.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/Atlas-Associates-Inc/Due-diligence-engine"
Repository = "https://github.com/Atlas-Associates-Inc/Due-diligence-engine"
Issues = "https://github.com/Atlas-Associates-Inc/Due-diligence-engine/issues"

[project.scripts]
dde = "src.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src"]
# Bundle the Noto TTF fonts (Vietnamese / Thai report rendering) into the wheel.
artifacts = ["src/report/fonts/*.ttf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
omit = ["src/report/fonts/*"]

[tool.coverage.report]
show_missing = true
